<mat-form-field appearance="fill" style="width: 100%">
  <mat-label>{{ label }}</mat-label>

  <input
    #input
    matInput
    type="text"
    inputmode="decimal"
    [imask]="maskOptions"
    [unmask]="true"
    [readonly]="readonly"
    [disabled]="disabled"
    [errorStateMatcher]="errorStateMatcher"
    (accept)="onAccept($event)"
    (blur)="handleBlur()"
  />

  @if (hasValue && !readonly && !disabled) {
    <button
      matSuffix
      mat-icon-button
      type="button"
      (click)="clear()"
      style="border-color: transparent; background: transparent"
      tabindex="-1"
    >
      <mat-icon>close</mat-icon>
    </button>
  }

  @if (showError) {
    <mat-error>{{ errorMessage }}</mat-error>
  }
</mat-form-field>
