<mat-form-field appearance="fill" style="width: 100%" (click)="handleClick()">
  <mat-label>{{ label }}</mat-label>

  @if (!readonly) {
    <input
      #input
      matInput
      type="text"
      autocomplete="off"
      [value]="texto"
      [disabled]="disabled"
      [errorStateMatcher]="errorStateMatcher"
      [matAutocomplete]="auto"
      (focus)="onFocus()"
      (input)="onInput($any($event.target).value)"
      (blur)="onBlur()"
    />

    <mat-autocomplete
      #auto="matAutocomplete"
      autoActiveFirstOption
      [displayWith]="mostrarDescripcion"
      (optionSelected)="onOptionSelected($event.option.value)"
    >
      @for (item of filtrados; track item.numero) {
        <mat-option [value]="item.numero">
          {{ item.descripcion }}
        </mat-option>
      } @empty {
        <mat-option disabled>
          {{ loading ? 'Buscando...' : 'Sin resultados' }}
        </mat-option>
      }
    </mat-autocomplete>
  } @else {
    <input
      matInput
      readonly
      [value]="texto"
      [errorStateMatcher]="errorStateMatcher"
    />
  }

  @if (hasValue && !readonly && !disabled) {
    <button
      matSuffix
      mat-icon-button
      type="button"
      aria-label="Clear"
      (click)="clear(); $event.stopPropagation()"
      style="border-color: transparent; background-color: transparent"
      tabindex="-1"
    >
      <mat-icon>close</mat-icon>
    </button>
  }

  @if (showError) {
    <mat-error>{{ errorMessage }}</mat-error>
  }
</mat-form-field>
